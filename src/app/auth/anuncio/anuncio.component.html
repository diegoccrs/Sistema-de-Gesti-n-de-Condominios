<div class="form-container">
  <h2>Crear anuncio</h2>

  <form #formulario="ngForm" (ngSubmit)="publicarAnuncio()" class="formulario">
    <div class="form-group">
      <label for="titulo">Título del anuncio</label>
      <input type="text" id="titulo" name="titulo" [(ngModel)]="anuncio.titulo" required />
    </div>

    <div class="form-group">
      <label for="descripcion">Descripción</label>
      <textarea id="descripcion" name="descripcion" [(ngModel)]="anuncio.descripcion" required></textarea>
    </div>

    <div class="form-group">
      <label for="fecha">Fecha de expiración</label>
      <input type="date" id="fecha" name="fecha" [(ngModel)]="anuncio.fecha" required />
    </div>

    <button type="submit" class="btn-publicar">Publicar anuncio</button>
  </form>
</div>
