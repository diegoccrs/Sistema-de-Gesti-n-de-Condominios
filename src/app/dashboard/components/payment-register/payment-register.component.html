<h2 mat-dialog-title>Reportar Nuevo Pago</h2>
<mat-dialog-content>
  <form [formGroup]="paymentForm" (ngSubmit)="onSubmit()" class="payment-register-form">
    
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Concepto del Pago</mat-label>
      <input matInput formControlName="concept" required placeholder="Ej: Condominio Mayo, Fondo de reserva">
      <mat-error *ngIf="paymentForm.get('concept')?.hasError('required')">
        El concepto es requerido.
      </mat-error>
    </mat-form-field>

    <div class="form-row">
      <mat-form-field appearance="outline" class="form-field-half">
        <mat-label>Monto</mat-label>
        <input matInput type="number" formControlName="amount" required placeholder="Ej: 150.75">
        <mat-error *ngIf="paymentForm.get('amount')?.hasError('required')">
          El monto es requerido.
        </mat-error>
        <mat-error *ngIf="paymentForm.get('amount')?.hasError('min')">
          El monto debe ser mayor a 0.
        </mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline" class="form-field-half">
        <mat-label>Moneda</mat-label>
        <mat-select formControlName="currency" required>
          <mat-option value="VES">VES</mat-option>
          <mat-option value="USD">USD</mat-option>
          <mat-option value="EUR">EUR</mat-option>
          
        </mat-select>
        <mat-error *ngIf="paymentForm.get('currency')?.hasError('required')">
          La moneda es requerida.
        </mat-error>
      </mat-form-field>
    </div>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Fecha de Realización del Pago</mat-label>
      <input matInput [matDatepicker]="picker" formControlName="payment_date" required>
      <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
      <mat-datepicker #picker></mat-datepicker>
      <mat-error *ngIf="paymentForm.get('payment_date')?.hasError('required')">
        La fecha de pago es requerida.
      </mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>URL del Comprobante (Opcional)</mat-label>
      <input matInput formControlName="proof_url" placeholder="Ej: https://example.com/comprobante.jpg">
      
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Notas Adicionales (Opcional)</mat-label>
      <textarea matInput formControlName="notes" rows="3" placeholder="Ej: Pago realizado desde Banco X, Referencia 12345"></textarea>
    </mat-form-field>

  </form>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button (click)="onCancel()" [disabled]="isLoading">Cancelar</button>
  <button mat-flat-button color="primary" (click)="onSubmit()" [disabled]="paymentForm.invalid || isLoading">
    <mat-spinner *ngIf="isLoading" diameter="20" color="accent" style="margin-right: 8px;"></mat-spinner>
    <span *ngIf="!isLoading">Reportar Pago</span>
    <span *ngIf="isLoading">Reportando...</span>
  </button>
</mat-dialog-actions>
