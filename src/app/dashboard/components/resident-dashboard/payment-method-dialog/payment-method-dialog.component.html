<h2 mat-dialog-title>Select a Payment Method</h2>

<mat-dialog-content class="payment-dialog-content">
    <div class="payment-details">
        <p><strong>Concept:</strong> {{ payment.concept }}</p>
        <p><strong>Amount:</strong> {{ payment.amount | currency:payment.currency }}</p>
    </div>

    <div class="payment-methods" *ngIf="!showStripeForm">
        <div *ngIf="isPayPalSupported; else notSupported">
            <div id="paypal-button-container"></div>
        </div>
        <ng-template #notSupported>
            <div class="not-supported-message">
                <mat-icon>warning</mat-icon>
                <span>This payment method is not available for the currency {{ payment.currency }}.</span>
            </div>
        </ng-template>
        <div class="payment-method-card" (click)="selectMethod('stripe')">
            <img src="/assets/icons/stripe.png" alt="Stripe" class="payment-icon" />
            <div class="payment-method-info">
                <span class="payment-method-title">Credit or Debit Card</span>
                <span class="payment-method-subtitle">Powered by Stripe</span>
            </div>
        </div>
    </div>

    <div class="stripe-form-container" *ngIf="showStripeForm">
        <app-stripe-payment
            [amount]="payment.amount"
            [currency]="payment.currency"
            (paymentResult)="handleStripePaymentResult($event)"
        ></app-stripe-payment>
    </div>
</mat-dialog-content>

<mat-dialog-actions align="end">
    <button mat-button (click)="dialogRef.close()">Cancel</button>
</mat-dialog-actions>
