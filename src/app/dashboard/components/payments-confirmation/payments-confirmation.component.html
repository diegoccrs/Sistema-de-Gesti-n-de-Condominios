<h2>Pagos Pendientes</h2>
<table mat-table [dataSource]="pagosPendientes" class="mat-elevation-z8" *ngIf="pagosPendientes.length > 0">

  <!-- Columna Monto -->
  <ng-container matColumnDef="amount">
    <th mat-header-cell *matHeaderCellDef>Monto</th>
    <td mat-cell *matCellDef="let pago">{{ pago.amount }}</td>
  </ng-container>

  <!-- Columna Moneda -->
  <ng-container matColumnDef="currency">
    <th mat-header-cell *matHeaderCellDef>Moneda</th>
    <td mat-cell *matCellDef="let pago">{{ pago.currency }}</td>
  </ng-container>

  <!-- Columna Fecha -->
  <ng-container matColumnDef="payment_date">
    <th mat-header-cell *matHeaderCellDef>Fecha</th>
    <td mat-cell *matCellDef="let pago">{{ pago.payment_date | date }}</td>
  </ng-container>

  <!-- Columna Estado -->
  <ng-container matColumnDef="status">
    <th mat-header-cell *matHeaderCellDef>Estado</th>
    <td mat-cell *matCellDef="let pago">{{ pago.status }}</td>
  </ng-container>

  <!-- Columna Acciones -->
  <ng-container matColumnDef="acciones">
    <th mat-header-cell *matHeaderCellDef>Acciones</th>
    <td mat-cell *matCellDef="let pago">
      <button mat-flat-button color="primary" (click)="aprobarPago(pago.id)">
        Aprobar
      </button>
      <button mat-flat-button color="warn" (click)="rechazarPago(pago.id)">
        Rechazar
      </button>
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
</table>

<div *ngIf="pagosPendientes.length === 0">
  <p>No hay pagos pendientes.</p>
</div>
