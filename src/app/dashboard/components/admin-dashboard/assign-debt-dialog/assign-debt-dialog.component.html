<div class="form-inner-container">
    <h2 class="form-title">Asignar Deuda</h2>
    <p class="form-description">Complete los detalles de la deuda a asignar</p>

    <form [formGroup]="form" (ngSubmit)="submit()" class="compact-form">
      <mat-form-field appearance="outline" class="compact-field">
        <mat-label>Concepto</mat-label>
        <input matInput formControlName="concept" required>
      </mat-form-field>

      <div class="compact-row">
        <mat-form-field appearance="outline" class="compact-field amount">
          <mat-label>Monto</mat-label>
          <input matInput type="number" formControlName="amount" required>
        </mat-form-field>

        <mat-form-field appearance="outline" class="compact-field currency">
          <mat-label>Moneda</mat-label>
          <mat-select formControlName="currency">
            <mat-option value="VES">VES</mat-option>
            <mat-option value="USD">USD</mat-option>
            <mat-option value="EUR">EUR</mat-option>
          </mat-select>
        </mat-form-field>
      </div>

      <mat-form-field appearance="outline" class="compact-field">
        <mat-label>Fecha de vencimiento</mat-label>
        <input matInput type="date" formControlName="payment_date" required>
      </mat-form-field>

      <div class="button-group">
        <button mat-flat-button color="primary" type="submit">Asignar</button>
        <button mat-flat-button color="primary" (click)="cancel()">Cancelar</button>
      </div>
    </form>
</div>
