<h2 mat-dialog-title>
    <mat-icon>edit</mat-icon>
    Editar Residente
</h2>

<mat-dialog-content>
    <form [formGroup]="editForm" (ngSubmit)="onSubmit()">
        <div class="form-container">
            <mat-form-field appearance="outline" class="full-width">
                <mat-label>Nombre</mat-label>
                <input matInput formControlName="first_name" required>
                <mat-error *ngIf="editForm.get('first_name')?.hasError('required')">
                    El nombre es requerido
                </mat-error>
            </mat-form-field>

            <mat-form-field appearance="outline" class="full-width">
                <mat-label>Apellido</mat-label>
                <input matInput formControlName="last_name" required>
                <mat-error *ngIf="editForm.get('last_name')?.hasError('required')">
                    El apellido es requerido
                </mat-error>
            </mat-form-field>

            <mat-dialog-actions align="end">
                <div class="actions-container">
                    <button mat-button color="warn" (click)="onDelete()" [disabled]="isDeleting" class="delete-button">
                        <mat-icon *ngIf="!isDeleting">delete</mat-icon>
                        <mat-spinner *ngIf="isDeleting" diameter="20"></mat-spinner>
                        Eliminar
                    </button>

                    <div class="spacer"></div>

                    <button mat-button (click)="onCancel()" [disabled]="isLoading || isDeleting">
                        <mat-icon>cancel</mat-icon> Cancelar
                    </button>
                    <button mat-raised-button color="primary" (click)="onSubmit()"
                        [disabled]="editForm.invalid || isLoading || isDeleting" class="save-button">
                        <mat-icon *ngIf="!isLoading">save</mat-icon>
                        <mat-spinner *ngIf="isLoading" diameter="20"></mat-spinner>
                        Guardar
                    </button>
                </div>
            </mat-dialog-actions>
