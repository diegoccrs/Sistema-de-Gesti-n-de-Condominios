<div class="manage-payments-container">
  <mat-card>
    <mat-card-header>
      <mat-card-title>Manage Payment Methods</mat-card-title>
      <mat-card-subtitle>View and manage your saved payment methods.</mat-card-subtitle>
    </mat-card-header>
    <mat-card-content>
      <div *ngIf="paymentMethods.length > 0; else noPaymentMethods">
        <mat-list>
          <mat-list-item *ngFor="let method of paymentMethods">
            <mat-icon matListItemIcon>credit_card</mat-icon>
            <div matListItemTitle>**** **** **** {{ method.card.last4 }}</div>
            <div matListItemLine>{{ method.card.brand | titlecase }} - Expires: {{ method.card.exp_month }}/{{ method.card.exp_year }}</div>
            <button mat-icon-button color="warn" (click)="deletePaymentMethod(method.id)" matListItemMeta>
              <mat-icon>delete</mat-icon>
            </button>
          </mat-list-item>
        </mat-list>
      </div>

      <ng-template #noPaymentMethods>
        <div class="no-methods-placeholder">
          <mat-icon>payment</mat-icon>
          <p>You have no saved payment methods.</p>
        </div>
      </ng-template>
    </mat-card-content>
    <mat-card-actions>
      <button mat-flat-button color="primary" (click)="openAddPaymentMethodDialog()">Add New Payment Method</button>
      <button mat-stroked-button (click)="returnToDashboard()">Return to Dashboard</button>
    </mat-card-actions>
  </mat-card>
</div>
